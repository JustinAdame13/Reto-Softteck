spring.application.name=pls

# Carga variables desde un archivo .env en la raiz del proyecto (opcional, no se sube a git).
# Las variables de entorno reales del sistema tienen prioridad sobre el .env.
spring.config.import=optional:file:.env[.properties]

server.port=${PORT:8080}

# ---------- Base de datos (PostgreSQL) ----------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tienda_inteligente}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# ---------- JPA ----------
# Flyway es el dueno del esquema; Hibernate solo valida que las entidades cuadren con las tablas.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# ---------- Flyway ----------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---------- API ----------
# Origenes permitidos para el frontend externo (separados por coma)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# ---------- IA (opcional) ----------
# Si IA_API_KEY esta vacia, el sistema funciona solo con el algoritmo BASE.
# El switch en tiempo de ejecucion vive en la tabla configuracion (ia_habilitada).
app.ia.api-key=${IA_API_KEY:}
app.ia.base-url=${IA_BASE_URL:https://api.anthropic.com}
app.ia.modelo=${IA_MODELO:}
app.ia.timeout-segundos=${IA_TIMEOUT:30}

# ---------- Motor de prediccion ----------
# interno = algoritmo BASE en Java (por defecto).
# externo = POST {MOTOR_URL}/predecir con EntradaPrediccion (por ejemplo, FastAPI en Python).
#           Si el externo falla, se usa el interno automaticamente.
app.motor.tipo=${MOTOR_TIPO:interno}
app.motor.url=${MOTOR_URL:http://localhost:8000}
