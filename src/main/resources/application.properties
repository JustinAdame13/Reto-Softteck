spring.application.name=pls

# =====================================================================
# Toda la configuracion sensible o que cambia por ambiente se lee de
# VARIABLES DE ENTORNO con la sintaxis ${VARIABLE:valorPorDefecto}.
# No hay archivo .env: cada ambiente pone sus propias variables.
#
#   - Local (IntelliJ): Run > Edit Configurations > PlsApplication >
#     Environment variables, por ejemplo:
#       DB_PASSWORD=tu_password;IA_ANTHROPIC_API_KEY=tu_llave
#   - Nube: en el panel de variables de entorno de la plataforma.
#
# Obligatoria: DB_PASSWORD (no tiene valor por defecto a proposito,
# para que nunca quede una contrasena escrita en el repositorio).
# Todas las demas tienen un valor por defecto pensado para correr local.
#
#   PORT, DB_URL, DB_USERNAME, DB_PASSWORD, SHOW_SQL, CORS_ORIGINS,
#   IA_ANTHROPIC_API_KEY, IA_ANTHROPIC_MODELO, IA_OPENAI_API_KEY,
#   IA_OPENAI_MODELO, IA_GEMINI_API_KEY, IA_GEMINI_MODELO, IA_TIMEOUT,
#   MOTOR_TIPO, MOTOR_URL
# =====================================================================

server.port=${PORT:8080}

# ---------- Base de datos (PostgreSQL) ----------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mibase_limpia}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ---------- JPA ----------
# Flyway es el dueno del esquema; Hibernate solo valida que las entidades cuadren con las tablas.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# ---------- Flyway ----------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Sin esto, un archivo mal nombrado (V3_x.sql, con un solo guion bajo) se ignora
# en silencio y la base se queda atras sin que nadie se entere.
spring.flyway.validate-migration-naming=true

# ---------- API ----------
# Origenes permitidos para el frontend externo (separados por coma)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# ---------- IA (opcional) ----------
# Una llave por proveedor. El proveedor sin llave no aparece en
# GET /configuracion/ia/proveedores y el switch lo rechaza con 422.
# Si ninguno tiene llave, el sistema funciona solo con Ayax sin IA (modelo BASE).
#
# QUE proveedor se usa lo decide la columna proveedor_ia de la tabla
# configuracion, que se cambia en caliente con PATCH /configuracion/ia.
# Estas properties solo dicen CUALES estan disponibles.
#
# El modelo es opcional: vacio = el valor por defecto de cada cliente.
# Verifica el nombre del modelo contra la documentacion del proveedor.
app.ia.anthropic.api-key=${IA_ANTHROPIC_API_KEY:}
app.ia.anthropic.base-url=${IA_ANTHROPIC_BASE_URL:https://api.anthropic.com}
app.ia.anthropic.modelo=${IA_ANTHROPIC_MODELO:}

app.ia.openai.api-key=${IA_OPENAI_API_KEY:}
app.ia.openai.base-url=${IA_OPENAI_BASE_URL:https://api.openai.com}
app.ia.openai.modelo=${IA_OPENAI_MODELO:}

app.ia.gemini.api-key=${IA_GEMINI_API_KEY:}
app.ia.gemini.base-url=${IA_GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
app.ia.gemini.modelo=${IA_GEMINI_MODELO:}

# 90 s: una llamada con 10 productos x 14 dias puede tardar mas de 30 s
app.ia.timeout-segundos=${IA_TIMEOUT:90}

# ---------- Motor de prediccion ----------
# interno = Ayax, el algoritmo propio en Java (por defecto).
# externo = POST {MOTOR_URL}/predecir con EntradaPrediccion (por ejemplo, FastAPI en Python).
#           Si el externo falla, se usa Ayax automaticamente.
app.motor.tipo=${MOTOR_TIPO:interno}
app.motor.url=${MOTOR_URL:http://localhost:8000}
